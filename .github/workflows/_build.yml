name: Build (reusable)

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Setup Rust (linux musl x86_64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cross-toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install npm dependencies
        run: npm ci

      - name: Build x86_64 binary for docker
        run: |
          npm run build
          cargo build --release -p silverbullet --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/silverbullet silverbullet-amd64

      - name: Upload raw docker binaries
        uses: actions/upload-artifact@v7
        with:
          name: docker-binaries
          path: |
            silverbullet-amd64
          if-no-files-found: error
